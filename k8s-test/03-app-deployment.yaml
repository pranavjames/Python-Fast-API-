apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  namespace: taskflow-poc
  labels:
    app: taskflow-api
spec:
  # Keep a single replica: the container runs migrations at start-up, and one pod
  # avoids two pods migrating at the same time on the very first deploy.
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-api
  template:
    metadata:
      labels:
        app: taskflow-api
    spec:
      initContainers:
        # Wait until MySQL accepts connections so migrations don't fail on first start.
        - name: wait-for-mysql
          image: ghcr.io/pranavjames/taskflow-api:latest
          command:
            - python
            - -c
            - |
              import socket, time
              for attempt in range(120):
                  try:
                      socket.create_connection(("mysql", 3306), timeout=2).close()
                      print("MySQL is reachable")
                      break
                  except OSError:
                      print("Waiting for MySQL...", flush=True)
                      time.sleep(5)
              else:
                  raise SystemExit("MySQL did not become reachable in time")
      containers:
        - name: api
          image: ghcr.io/pranavjames/taskflow-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskflow-api-config
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
