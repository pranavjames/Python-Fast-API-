# OPTIONAL — requires External Secrets Operator and a ClusterSecretStore pointing at
# AWS Secrets Manager. Not included in kustomization.yaml by default; add it to the
# overlay's `resources` once the operator is installed.
#
# Expected Secrets Manager secret `prod/taskflow/api` (JSON):
#   {"SECRET_KEY": "...", "MYSQL_USER": "taskflow", "MYSQL_PASSWORD": "..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taskflow-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: taskflow-api-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/taskflow/api
