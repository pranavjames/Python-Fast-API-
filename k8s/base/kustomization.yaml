apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow

labels:
  - pairs:
      app.kubernetes.io/name: taskflow-api
      app.kubernetes.io/part-of: taskflow
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - migration-job.yaml
