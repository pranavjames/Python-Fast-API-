apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  labels:
    app.kubernetes.io/component: api
spec:
  # No `replicas` field: the HorizontalPodAutoscaler owns the replica count.
  # (Setting it here would make every `kubectl apply` reset the HPA's decision.)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: taskflow-api
      automountServiceAccountToken: false
      # Must exceed preStop sleep + uvicorn graceful shutdown (20s).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across AZs and nodes so one failure can't take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: taskflow-api
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: taskflow-api
              app.kubernetes.io/component: api
      containers:
        - name: api
          # Replaced per environment by the overlay's `images:` section.
          image: taskflow-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: taskflow-api-config
            - secretRef:
                name: taskflow-api-secrets
          env:
            - name: PORT
              value: "8000"
          resources:
            # HPA utilisation targets are computed against these requests.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24  # up to 2 minutes to start
          livenessProbe:
            # Liveness must NOT depend on the database, otherwise a DB outage
            # would cause Kubernetes to restart every healthy pod.
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving while the NLB deregisters this pod's IP target,
              # so in-flight and newly-routed requests aren't dropped.
              exec:
                command: ["sleep", "15"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
