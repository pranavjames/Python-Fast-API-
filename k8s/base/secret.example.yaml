# EXAMPLE ONLY — this file is NOT included in kustomization.yaml and must never hold real values in git.
#
# Create the real Secret out-of-band, e.g.:
#   kubectl -n taskflow create secret generic taskflow-api-secrets \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
#     --from-literal=MYSQL_USER=taskflow \
#     --from-literal=MYSQL_PASSWORD='<db-password>'
#
# Recommended for production: sync it from AWS Secrets Manager with External Secrets Operator
# (see external-secret.example.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-api-secrets
  namespace: taskflow
type: Opaque
stringData:
  SECRET_KEY: "<at-least-32-random-characters>"
  MYSQL_USER: "taskflow"
  MYSQL_PASSWORD: "<db-password>"
