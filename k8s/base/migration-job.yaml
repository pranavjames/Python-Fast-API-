# Applies database migrations once per release, before the new pods roll out.
#
# * Argo CD: runs automatically as a PreSync hook; the previous Job is deleted first.
# * Plain kubectl: Jobs are immutable, so delete the old one before applying a new image:
#     kubectl -n taskflow delete job taskflow-api-migrate --ignore-not-found
#     kubectl apply -k k8s/overlays/production
#     kubectl -n taskflow wait --for=condition=complete job/taskflow-api-migrate --timeout=10m
apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-api-migrate
  labels:
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-api
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: taskflow-api
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: taskflow-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: taskflow-api-config
            - secretRef:
                name: taskflow-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
